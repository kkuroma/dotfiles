dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    mfact = 0.48
    new_status = slave
}

scrolling {
    column_width = 0.8
    focus_fit_method = 0
    follow_focus = true
    follow_min_visible = 0
}

# default per-workspace layout
workspace = 1, layout:master # terminals
workspace = 11, layout:master # terminals
workspace = 4, layout:monocle