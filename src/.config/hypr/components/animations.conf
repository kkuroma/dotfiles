# Modified from End-4's animations
# credit https://github.com/end-4/dots-hyprland

animations {
    enabled = true

    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15

    # Disable everything first
    animation = global, 0

    # Re-enable only what you want
    animation = windows, 1, 1.0, md3_decel, popin
    animation = windowsIn, 1, 1.0, md3_decel, popin
    animation = windowsOut, 1, 1.0, md3_accel, popin
    animation = workspaces, 1, 1.0, md3_decel, slidefade 10%
    animation = specialWorkspace, 1, 1.0, md3_decel, slidevert
}